<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171412">
<title>FriendTest 🧡</title>
<style>
:root {
  --bg: #171412;
  --card: #241E19;
  --accent: #C65D32;
  --accent-hover: #E0784D;
  --cream: #F5EBDD;
  --muted: #C4B4A4;
  --border: #49362B;
  --option: #30261F;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--cream);
}
main {
  max-width: 650px;
  margin: auto;
  padding: 20px 14px;
}
header {
  text-align: center;
  padding: 22px 15px;
}
.logo {
  font-size: 48px;
}
h1 {
  color: var(--accent-hover);
  margin: 10px;
}
h2 {
  color: var(--cream);
}
p {
  color: var(--muted);
  line-height: 1.8;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin: 15px 0;
  box-shadow: 0 8px 25px #00000030;
}
label {
  display: block;
  font-weight: bold;
  margin: 13px 0 7px;
}
input {
  font: inherit;
  max-width: 100%;
}
.name {
  width: 100%;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #191511;
  color: var(--cream);
  outline: none;
}
.name:focus {
  border-color: var(--accent);
}
.name::placeholder {
  color: #9D8A79;
}
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 12px;
  padding: 13px;
  font-weight: bold;
  transition: 0.2s;
}
button:active {
  transform: scale(0.98);
}
.primary {
  background: var(--accent);
  color: white;
  width: 100%;
  margin-top: 12px;
}
.primary:hover {
  background: var(--accent-hover);
}
.secondary {
  background: #3B2B21;
  color: var(--cream);
  width: 100%;
  margin-top: 9px;
  border: 1px solid var(--border);
}
.secondary:hover {
  background: #493326;
}
.question {
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 13px;
  margin: 13px 0;
  background: #211A15;
}
.question strong {
  display: block;
  margin-bottom: 10px;
  line-height: 1.7;
}
.option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px;
  background: var(--option);
  border: 1px solid transparent;
  border-radius: 10px;
  margin: 7px 0;
  font-weight: normal;
  cursor: pointer;
  color: var(--cream);
}
.option:has(input:checked) {
  border-color: var(--accent);
  background: #463025;
}
.option input {
  accent-color: var(--accent);
  flex-shrink: 0;
}
.hidden {
  display: none !important;
}
.center {
  text-align: center;
}
.score {
  font-size: 48px;
  color: var(--accent-hover);
  font-weight: bold;
}
.small {
  font-size: 12px;
  color: var(--muted);
}
#link {
  direction: ltr;
  text-align: left;
}
@media (max-width: 400px) {
  main {
    padding: 12px 10px;
  }
  .card {
    padding: 15px;
  }
}
</style>
</head>
<body>
<main>
<header>
  <div class="logo">🧡</div>
  <h1>FriendTest</h1>
  <p>دير تاست و تاستي صحابك! 🤎</p>
</header>
<section class="card" id="create">
  <h2>✨ اخدم الاختبار</h2>
  <label for="creator">اسمك</label>
  <input class="name" id="creator" placeholder="اكتب اسمك">
  <div id="builder"></div>
  <button class="primary" onclick="createLink()">
    إنشاء رابط الاختبار 🔗
  </button>
</section>
<section class="card hidden" id="share">
  <h2>🎉 كملت!</h2>
  <p>كوبي الرابط وابعثه لصاحبك.</p>
  <input class="name" id="link" readonly>
  <button class="primary" onclick="copyLink()">نسخ الرابط 📋</button>
  <button class="secondary" onclick="shareLink()">مشاركة الرابط ↗</button>
  <p class="small">رابط الاختبار يحتوي على الأسئلة وإجاباتك الصحيحة.</p>
  <p> موقع مزالو قيد التطوير مع لوقت نزيد نحسنو</p>
  <button class="secondary" onclick="location.href=location.pathname">
    إنشاء اختبار جديد
  </button>
</section>
<section class="card hidden" id="play">
  <h2 id="playTitle">FriendTest 🧡</h2>
  <p>اختار الإجابة الصحيحة عن صاحبك!</p>
  <div id="playQuestions"></div>
  <button class="primary" onclick="checkAnswers()">شوف النتيجة 🏆</button>
</section>
<section class="card hidden center" id="result">
  <h2>نتيجتك 🧡</h2>
  <div class="score" id="score">0/10</div>
  <p id="message"></p>
  <button class="primary" onclick="shareScore()">مشاركة النتيجة</button>
  <button class="secondary" onclick="location.href=location.pathname">
    اختبار جديد
  </button>
</section>
</main>
<script>
const bank = [
["لونك المفضل؟",["الأزرق","الأسود","الأحمر","الأخضر"]],
["لعبتك المفضلة؟",["Minecraft","Blood Strike","Free Fire","كرة القدم"]],
["أكلك المفضل؟",["بيتزا","برغر","شاورما","مكرونة"]],
["مشروبك المفضل؟",["ماء","عصير","قهوة","مشروب غازي"]],
["وقتك المفضل؟",["الصباح","العصر","المساء","الليل"]],
["وش تحب في العطلة؟",["اللعب","الخروج","النوم","مشاهدة الأفلام"]],
["نوع الفيديوهات الذي تفضله؟",["ألعاب","كوميديا","رياضة","قصص"]],
["رياضتك المفضلة؟",["كرة القدم","كرة السلة","السباحة","لا شيء"]],
["حيوانك المفضل؟",["القطط","الكلاب","الطيور","الأرانب"]],
["أكثر صفة تحبها في الصديق؟",["الوفاء","المرح","الصراحة","الاهتمام"]],
["فصلك المفضل؟",["الشتاء","الصيف","الربيع","الخريف"]],
["نوع الألعاب الذي تحبه؟",["العالم المفتوح","التصويب","الألغاز","السباقات"]],
["حلاك المفضل؟",["الشوكولاتة","المثلجات","الكعك","الحلوى"]],
["وش تختار في يوم فارغ؟",["ألعب","أخرج","أشاهد فيلمًا","أتعلم شيئًا"]],
["وش اللي يضحكك؟",["الميمز","مواقف الأصدقاء","النكت","المقاطع المضحكة"]],
["مكانك المفضل؟",["البحر","الجبال","المدينة","مكان هادئ"]],
["كيفاش تحب التواصل؟",["الرسائل","المكالمات","وجهًا لوجه","الفيديو"]],
["وش اللي يحمسك؟",["التحديات","الفوز","الأصدقاء","الاكتشاف"]],
["وش أكثر شيء تقدّره؟",["الثقة","الاحترام","المرح","المساعدة"]],
["أي هدية تفضل؟",["شيء مفيد","هدية شخصية","رسالة جميلة","مفاجأة"]]
];
let questions = [], correct = [], answers = [], owner = "";
function el(id) {
  return document.getElementById(id);
}
function hideAll() {
  ["create","share","play","result"].forEach(id =>
    el(id).classList.add("hidden")
  );
}
function show(id) {
  hideAll();
  el(id).classList.remove("hidden");
  window.scrollTo(0,0);
}
function shuffle(a) {
  return [...a].sort(() => Math.random() - 0.5);
}
function build() {
  questions = shuffle(bank).slice(0,10);
  correct = Array(10).fill(null);
  el("builder").innerHTML = "";
  questions.forEach((q,i) => {
    let box = document.createElement("div");
    box.className = "question";
    let title = document.createElement("strong");
    title.textContent = `السؤال ${i+1}: ${q[0]}`;
    box.appendChild(title);
    q[1].forEach((answer,j) => {
      let label = document.createElement("label");
      label.className = "option";
      let radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "correct" + i;
      radio.onchange = () => correct[i] = j;
      label.append(radio, document.createTextNode(answer));
      box.appendChild(label);
    });
    el("builder").appendChild(box);
  });
}
function encode(obj) {
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))
    .replace(/\+/g,"-")
    .replace(/\//g,"_")
    .replace(/=+$/,"");
}
function decode(str) {
  str = str.replace(/-/g,"+").replace(/_/g,"/");
  while (str.length % 4) str += "=";
  return JSON.parse(decodeURIComponent(escape(atob(str))));
}
function createLink() {
  owner = el("creator").value.trim();
  if (!owner) {
    alert("اكتب اسمك أولًا");
    return;
  }
  let missing = correct.findIndex(x => x === null);
  if (missing !== -1) {
    alert("اختر الإجابة الصحيحة للسؤال " + (missing+1));
    return;
  }
  const data = {
    name: owner,
    questions: questions.map((q,i) => ({
      q: q[0],
      a: q[1],
      c: correct[i]
    }))
  };
  el("link").value =
    location.href.split("#")[0] + "#test=" + encode(data);
  show("share");
}
async function copyLink() {
  try {
    await navigator.clipboard.writeText(el("link").value);
    alert("تم نسخ الرابط!");
  } catch(e) {
    el("link").select();
    alert("اضغط مطولًا على الرابط وانسخه.");
  }
}
async function shareLink() {
  try {
    if (navigator.share) {
      await navigator.share({
        title: "FriendTest 🧡",
        text: "اختبر روحك وشوف شحال تعرفني!",
        url: el("link").value
      });
    } else {
      await copyLink();
    }
  } catch(e) {}
}
function loadTest(data) {
  owner = data.name;
  el("playTitle").textContent = "اختبار " + owner + " 🧡";
  el("playQuestions").innerHTML = "";
  answers = Array(10).fill(null);
  data.questions.forEach((q,i) => {
    let box = document.createElement("div");
    box.className = "question";
    let title = document.createElement("strong");
    title.textContent = `${i+1}. ${q.q}`;
    box.appendChild(title);
    q.a.forEach((a,j) => {
      let label = document.createElement("label");
      label.className = "option";
      let radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "answer" + i;
      radio.onchange = () => answers[i] = j;
      label.append(radio, document.createTextNode(a));
      box.appendChild(label);
    });
    el("playQuestions").appendChild(box);
  });
  show("play");
}
function checkAnswers() {
  let missing = answers.findIndex(x => x === null);
  if (missing !== -1) {
    alert("أجب عن السؤال " + (missing+1));
    return;
  }
  const data = decode(location.hash.slice(6));
  const score = answers.reduce(
    (sum,a,i) => sum + (a === data.questions[i].c ? 1 : 0), 0
  );
  el("score").textContent = score + "/10";
  el("message").textContent =
    score === 10 ? "واو! تعرفه جيدًا جدًا! 🎉" :
    score >= 7 ? "ممتاز! تعرف عنه الكثير 🧡" :
    score >= 4 ? "نتيجة جيدة، ما زال هناك المزيد لتكتشفه!" :
    "يبدو أن عليك معرفة المزيد عنه 😄";
  show("result");
}
async function shareScore() {
  const text =
    `جبت ${el("score").textContent} في اختبار FriendTest 🧡!`;
  try {
    if (navigator.share) {
      await navigator.share({title:"FriendTest",text});
    } else {
      await navigator.clipboard.writeText(text);
      alert("تم نسخ النتيجة");
    }
  } catch(e) {}
}
function boot() {
  if (location.hash.startsWith("#test=")) {
    try {
      const data = decode(location.hash.slice(6));
      if (!data.questions || data.questions.length !== 10) {
        throw Error();
      }
      loadTest(data);
    } catch(e) {
      build();
      show("create");
    }
  } else {
    build();
    show("create");
  }
}
boot();
</script>
</body>
</html>
